buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {

    classpath "com.android.tools.build:gradle:9.2.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/WalletNative+autolinking.gradle'

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"


}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["WalletNative_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["WalletNative_" + name]).toInteger()
}

android {
  namespace = "com.margelo.nitro.qntxwallet"

  ndkVersion = getExtOrDefault("ndkVersion")
  compileSdkVersion = getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion = getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion = getExtOrIntegerDefault("targetSdkVersion")

    consumerProguardFiles "consumer-rules.pro"

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        // The consuming app's react-native root — resolved through node module
        // resolution from the app project (as RN's own settings.gradle does);
        // compile-kernel.mjs then resolves hermesc through it.
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
            // The consuming app's react-native dir, resolved through node
            // module resolution from the app project — a library cannot reach
            // it by walking up from its own tree.
            "-DQNTX_REACT_NATIVE_PATH=" + providers.exec {
                workingDir = rootProject.projectDir
                commandLine "node", "-p", "require('path').dirname(require.resolve('react-native/package.json'))"
            }.standardOutput.asText.get().trim(),
            // The app's @qntx/spark-native dir (header + per-ABI libqntx_spark.so),
            // resolved the same way.
            "-DQNTX_SPARK_NATIVE_PATH=" + providers.exec {
                workingDir = rootProject.projectDir
                commandLine "node", "-p", "require('path').dirname(require.resolve('@qntx/spark-native/package.json'))"
            }.standardOutput.asText.get().trim()
        abiFilters (*reactNativeArchitectures())
        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path = file("CMakeLists.txt")
    }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libNitroModules.so",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so",
      // Linked, not bundled — @qntx/spark-native packages it from its jniLibs.
      "**/libqntx_spark.so"
    ]
  }

  buildFeatures {
    buildConfig = true
    prefab = true
  }

  buildTypes {
    release {
      minifyEnabled = false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

dependencies {
  // For > 0.71, this is replaced by `com.facebook.react:react-android:$version` by the React
  // gradle plugin — it supplies the fbjni/ReactAndroid prefab packages the generated CMake
  // autolinking file finds with find_package.
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Hermes engine prefab — the kernel runtime links hermesvm/libhermes
  implementation "com.facebook.react:hermes-android"

  // NitroModules core (provides the react-native-nitro-modules prefab + HybridObject runtime)
  implementation project(":react-native-nitro-modules")

  // ProcessLifecycleOwner for the background lock (W7) — the version the app
  // already resolves for androidx.lifecycle.
  implementation "androidx.lifecycle:lifecycle-process:2.6.2"
}

repositories {
  mavenCentral()
  google()
}
