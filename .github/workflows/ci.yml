name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      bun-version: ${{ steps.bun.outputs.bun-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

  ci:
    needs: toolchain
    uses: qntx/workflows/.github/workflows/ci-bun.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
    with:
      scripts: "check:pkg test:coverage"
      timeout-minutes: 30
      bun-version: ${{ needs.toolchain.outputs.bun-version }}
    # bun run lint → build + vp check + check-version + check-cycles + build-provider + check-lint-boundaries
    # bun run test → vp run -r test (per-package vp test)
    # scripts → bun run check:pkg && bun run test:coverage

  audit:
    # Fails on any advisory in bun.lock; an accepted one is listed with `--ignore <GHSA>` here,
    # with the reason in the PR that adds it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, published 2026-11-17, no fixed release yet): reached
      # only through build and test tooling (tinyglobby in bumpp, vitest, nitrogen, madge,
      # react-native codegen), which glob this repository's own files. Remove once a fix ships.
      # GHSA-848j-6mx2-7j84 (elliptic, no fixed release), GHSA-58qx-3vcg-4xpx and
      # GHSA-96hv-2xvq-fx4p (ws 8.18.0, pinned exactly by @ethersproject/providers 5.8.0): reached
      # only through @polymarket/clob-client-v2, a root devDependency that scripts/vectors/polymarket.ts
      # uses as the signing oracle. It is never bundled and opens no socket there. Remove when the
      # SDK drops ethers v5.
      - run: >-
          bun audit
          --ignore GHSA-fc5q-39xc-vjpf
          --ignore GHSA-848j-6mx2-7j84
          --ignore GHSA-58qx-3vcg-4xpx
          --ignore GHSA-96hv-2xvq-fx4p

  evm-anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.10.0
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - run: |
          set -euo pipefail
          ENGINE_E2E_ANVIL=1 bunx vp test --project unit tests/evm-anvil.test.ts tests/evm-7702-anvil.test.ts tests/approvals-anvil.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          ENGINE_E2E_ANVIL=1 bunx vp test --project unit tests/evm-anvil.test.ts tests/evm-7702-anvil.test.ts tests/nft-anvil.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' /tmp/e2e.json
        working-directory: packages/wallet-engine

  solana-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      # Official Agave release binaries; the SHA-256 was computed once from the
      # published asset (releases ship no checksum file) and is pinned here.
      - run: |
          set -e
          curl -fsSL --retry 3 -o /tmp/sol.tar.bz2 https://github.com/anza-xyz/agave/releases/download/v4.4.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574  /tmp/sol.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/sol.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          ENGINE_E2E_SOLANA=1 bunx vp test --project unit tests/solana-e2e.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' /tmp/e2e.json
        working-directory: packages/wallet-engine

  bitcoin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-chains#build && bunx vp run @qntx/wallet-engine#build
      # blockstream/esplora bundles bitcoind + electrs + the REST API (mounted at /regtest/api).
      - run: |
          set -euo pipefail
          ENGINE_E2E_BITCOIN=1 bunx vp test --project unit tests/bitcoin-e2e.test.ts --silent=false --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' /tmp/e2e.json
        working-directory: packages/wallet-engine

  tron-e2e:
    runs-on: ubuntu-latest
    services:
      # TronBox Runtime Environment — the java-tron devnet; produces one block per transaction.
      tre:
        # tag 2.0.0, digest from https://hub.docker.com/v2/repositories/tronbox/tre/tags/2.0.0
        # (checked 2026-11-22), rotate by re-reading that URL's `digest`.
        image: tronbox/tre@sha256:f4332e11df12a9f360639a4546fd046593909630fda48af00b30410c144342f0
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.10.0
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-chains#build && bunx vp run @qntx/wallet-engine#build
      - run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            curl -sf -X POST http://127.0.0.1:9090/wallet/getnowblock -o /dev/null && break
            sleep 1
          done
          curl -sf -X POST http://127.0.0.1:9090/wallet/getnowblock -o /dev/null
          ENGINE_E2E_TRON=1 bunx vp test --project unit tests/tron-e2e.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' /tmp/e2e.json
        working-directory: packages/wallet-engine

  # The real gateway in real workerd: Durable Object leasing, rate-limit bindings and the deploy
  # bundle itself — `wrangler deploy --dry-run` compiles what Cloudflare would run.
  gateway-workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - run: bun run --cwd apps/gateway test:workerd
      - run: bunx wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/gw-prod"
        working-directory: apps/gateway
      - run: bunx wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/gw-staging"
        working-directory: apps/gateway
