name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    with:
      scripts: "check:pkg test:coverage"
    # bun run lint → vp check + check-version
    # bun run test → vp run -r test (per-package vp test)
    # scripts → bun run check:pkg && bun run test:coverage

  evm-anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - run: |
          ENGINE_E2E_ANVIL=1 bunx vitest run tests/evm-anvil.test.ts 2>&1 | tee /tmp/e2e.out
          ! grep -q "skipped" /tmp/e2e.out
        working-directory: packages/wallet-engine

  solana-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      # Official Agave release binaries; the SHA-256 was computed once from the
      # published asset (releases ship no checksum file) and is pinned here.
      - run: |
          set -e
          curl -sL -o /tmp/sol.tar.bz2             https://github.com/anza-xyz/agave/releases/download/v3.1.11/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "5978d621fe2582fc2403fa13f3c06502020bcb42e806ddd4612150049d1a3fbb  /tmp/sol.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/sol.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
      - run: |
          ENGINE_E2E_SOLANA=1 bunx vitest run tests/solana-e2e.test.ts 2>&1 | tee /tmp/e2e.out
          ! grep -q "1 skipped" /tmp/e2e.out
        working-directory: packages/wallet-engine

  bitcoin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-chains#build && bunx vp run @qntx/wallet-engine#build
      # blockstream/esplora bundles bitcoind + electrs + the REST API (mounted at /regtest/api).
      - run: |
          ENGINE_E2E_BITCOIN=1 bunx vitest run tests/bitcoin-e2e.test.ts 2>&1 | tee /tmp/e2e.out
          ! grep -q "1 skipped" /tmp/e2e.out
        working-directory: packages/wallet-engine
