name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@b1a930e790044f34f06bd5e1e0ede9e7dd5fa122 # v2.13.1
    permissions:
      contents: read
    with:
      scripts: "check:pkg test:coverage"
    # bun run lint → vp check + check-version
    # bun run test → vp run -r test (per-package vp test)
    # scripts → bun run check:pkg && bun run test:coverage

  audit:
    # Fails on any advisory in bun.lock; an accepted one is listed with `--ignore <GHSA>` here,
    # with the reason in the PR that adds it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit

  evm-anvil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - run: |
          set -euo pipefail
          ENGINE_E2E_ANVIL=1 bunx vitest run tests/evm-anvil.test.ts tests/evm-7702-anvil.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' /tmp/e2e.json
        working-directory: packages/wallet-engine

  solana-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      # Official Agave release binaries; the SHA-256 was computed once from the
      # published asset (releases ship no checksum file) and is pinned here.
      - run: |
          set -e
          curl -fsSL --retry 3 -o /tmp/sol.tar.bz2 https://github.com/anza-xyz/agave/releases/download/v4.4.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574  /tmp/sol.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/sol.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          ENGINE_E2E_SOLANA=1 bunx vitest run tests/solana-e2e.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' /tmp/e2e.json
        working-directory: packages/wallet-engine

  bitcoin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-chains#build && bunx vp run @qntx/wallet-engine#build
      # blockstream/esplora bundles bitcoind + electrs + the REST API (mounted at /regtest/api).
      - run: |
          set -euo pipefail
          ENGINE_E2E_BITCOIN=1 bunx vitest run tests/bitcoin-e2e.test.ts --silent=false --reporter=default --reporter=json --outputFile.json=/tmp/e2e.json
          jq -e '.numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' /tmp/e2e.json
        working-directory: packages/wallet-engine
