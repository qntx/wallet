name: Gateway

# Staging follows main: every commit whose CI run passed is deployed. Production is a manual
# dispatch from main that redeploys a commit CI has passed, behind the environment's reviewers.
# A failed smoke rolls the deployment back. Nothing runs until the
# repository variable GATEWAY_DEPLOY is "true": each environment needs its own Cloudflare account
# and token first (apps/gateway/README.md, .github/rulesets/apply.sh).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  staging:
    if: >-
      vars.GATEWAY_DEPLOY == 'true' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    environment: staging
    concurrency:
      group: gateway-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require a passed CI run on main for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT" \
            --branch main --event push --status success --json databaseId --jq length)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on main for $COMMIT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Workers Scripts Edit is account-wide: a token that can deploy staging into the production
      # account can also replace the production Worker, read its secrets and write its KV.
      - name: Require staging to live outside the production account
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          read -r staging production < <(bun -e '
            const { env } = Bun.JSONC.parse(await Bun.file("wrangler.jsonc").text());
            console.log(env.staging.account_id, env.production.account_id);
          ')
          if [ -z "$staging" ] || [ "$staging" = "$production" ]; then
            echo "::error::staging still deploys into the production account $production —"
            echo "::error::create a separate Cloudflare account holding the staging zone and a"
            echo "::error::RISK KV namespace, update env.staging.account_id and the KV ids in"
            echo "::error::apps/gateway/wrangler.jsonc, and scope the 'staging' environment's"
            echo "::error::CLOUDFLARE_API_TOKEN to that account only."
            echo "::error::See apps/gateway/README.md \"Deployment pipeline\" — staging stays"
            echo "::error::blocked by design until it has its own account."
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$production/workers/scripts")"
          case "$status" in
            401 | 403) ;;
            *)
              echo "::error::the staging token is not refused by the production account (HTTP $status)"
              exit 1
              ;;
          esac
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - name: Check required secrets
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/deploy-check.ts secrets staging
      - name: Plan rollback
        id: plan
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/deploy-check.ts rollback-plan staging "$COMMIT"
      - id: deploy
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --env staging --message "deploy $COMMIT"
      - working-directory: apps/gateway
        run: bun scripts/smoke.ts https://wallet-gateway-staging.qntx.org staging
      - name: Roll back a deployment whose smoke failed
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version != ''
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_VERSION: ${{ steps.plan.outputs.rollback_version }}
        run: >-
          bunx wrangler rollback "$ROLLBACK_VERSION"
          --env staging --message "smoke failed for $COMMIT" --yes
      - name: Alert when automatic rollback is impossible
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version == ''
        env:
          ROLLBACK_REASON: ${{ steps.plan.outputs.rollback_reason }}
        run: |
          echo "::error::automatic rollback impossible: $ROLLBACK_REASON — see apps/gateway/README.md \"Operator runbook\""
          exit 1

  production:
    if: >-
      vars.GATEWAY_DEPLOY == 'true' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: gateway-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - name: Require a passed CI run on main for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT" \
            --branch main --event push --status success --json databaseId --jq length)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on main for $COMMIT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - name: Check required secrets
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/deploy-check.ts secrets production
      - name: Plan rollback
        id: plan
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/deploy-check.ts rollback-plan production "$COMMIT"
      - id: deploy
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --env production --message "deploy $COMMIT"
      - working-directory: apps/gateway
        run: bun scripts/smoke.ts https://gateway.meowl.xyz production
      - name: Roll back a deployment whose smoke failed
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version != ''
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_VERSION: ${{ steps.plan.outputs.rollback_version }}
        run: >-
          bunx wrangler rollback "$ROLLBACK_VERSION"
          --env production --message "smoke failed for $COMMIT" --yes
      - name: Alert when automatic rollback is impossible
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version == ''
        env:
          ROLLBACK_REASON: ${{ steps.plan.outputs.rollback_reason }}
        run: |
          echo "::error::automatic rollback impossible: $ROLLBACK_REASON — see apps/gateway/README.md \"Operator runbook\""
          exit 1
