name: Gateway

# Staging follows main: every commit whose CI run passed is deployed. Production is a manual
# dispatch from main that redeploys a commit CI has passed, behind the environment's reviewers.
# A failed smoke rolls the deployment back. Nothing runs until the repository variable
# GATEWAY_DEPLOY is "true". Staging and production share one Cloudflare account, so both
# environments require the same reviewer and the gate job below checks it
# (apps/gateway/README.md "Deployment pipeline", .github/rulesets/apply.sh).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    if: >-
      vars.GATEWAY_DEPLOY == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      # A job without an environment sees only repository and organization secrets — a
      # CLOUDFLARE_API_TOKEN there reaches every job, so it must exist as an environment secret
      # only and any value here fails.
      - name: Refuse a repository or organization CLOUDFLARE_API_TOKEN
        env:
          SHARED_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$SHARED_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is set as a repository or organization secret —"
            echo "::error::it reaches every job, staging's included. Delete it; the token must"
            echo "::error::exist only as a secret of the staging and production environments."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # deploy-check.ts imports only node builtins and ./jsonc.ts — no bun install needed.
      - name: Require the same reviewer gate and no shared state
        working-directory: apps/gateway
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/deploy-check.ts environments

  staging:
    if: >-
      vars.GATEWAY_DEPLOY == 'true' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    needs: gate
    environment: staging
    concurrency:
      group: gateway-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require a passed CI run on main for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT" \
            --branch main --event push --status success --json databaseId --jq length)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on main for $COMMIT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Require the token to belong to the env's Cloudflare account
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/deploy-check.ts token staging
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - name: Check required secrets
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/deploy-check.ts secrets staging
      - name: Plan rollback
        id: plan
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/deploy-check.ts rollback-plan staging "$COMMIT"
      - id: deploy
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --env staging --message "deploy $COMMIT"
      - working-directory: apps/gateway
        run: bun scripts/smoke.ts https://wallet-gateway-staging.qntx.org staging
      - name: Roll back a deployment whose smoke failed
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version != ''
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_VERSION: ${{ steps.plan.outputs.rollback_version }}
        run: >-
          bunx wrangler rollback "$ROLLBACK_VERSION"
          --env staging --message "smoke failed for $COMMIT" --yes
      - name: Alert when automatic rollback is impossible
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version == ''
        env:
          ROLLBACK_REASON: ${{ steps.plan.outputs.rollback_reason }}
        run: |
          echo "::error::automatic rollback impossible: $ROLLBACK_REASON — see apps/gateway/README.md \"Operator runbook\""
          exit 1

  production:
    if: >-
      vars.GATEWAY_DEPLOY == 'true' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    needs: gate
    environment: production
    concurrency:
      group: gateway-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - name: Require a passed CI run on main for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT" \
            --branch main --event push --status success --json databaseId --jq length)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run on main for $COMMIT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Require the token to belong to the env's Cloudflare account
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/deploy-check.ts token production
      - run: bun install --frozen-lockfile
      - run: bunx vp run @qntx/wallet-engine#build
      - name: Check required secrets
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/deploy-check.ts secrets production
      - name: Plan rollback
        id: plan
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/deploy-check.ts rollback-plan production "$COMMIT"
      - id: deploy
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --env production --message "deploy $COMMIT"
      - working-directory: apps/gateway
        run: bun scripts/smoke.ts https://gateway.meowl.xyz production
      - name: Roll back a deployment whose smoke failed
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version != ''
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_VERSION: ${{ steps.plan.outputs.rollback_version }}
        run: >-
          bunx wrangler rollback "$ROLLBACK_VERSION"
          --env production --message "smoke failed for $COMMIT" --yes
      - name: Alert when automatic rollback is impossible
        if: failure() && steps.deploy.outcome == 'success' && steps.plan.outputs.rollback_version == ''
        env:
          ROLLBACK_REASON: ${{ steps.plan.outputs.rollback_reason }}
        run: |
          echo "::error::automatic rollback impossible: $ROLLBACK_REASON — see apps/gateway/README.md \"Operator runbook\""
          exit 1
