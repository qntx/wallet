name: Ledger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speculos:
    # Builds the pinned Ledger apps in Ledger's builder image and runs the kernel's
    # speculos suite (packages/wallet-kernel/tests/speculos) against them.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The app builds take minutes each; the ELFs and the skip records only change with apps.json.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/ledger/elf
            .cache/ledger/build.json
          key: ledger-elf-${{ hashFiles('scripts/ledger/apps.json') }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/ledger/build-apps.ts
      - run: bun scripts/ledger/speculos.ts
      - run: bun run --cwd packages/wallet-kernel test:speculos
      - if: always()
        run: bun scripts/ledger/speculos.ts stop
