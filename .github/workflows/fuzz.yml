name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  # A change to the fuzz suites or to this workflow runs a short pass, so a broken
  # command is caught on the pull request and not by a scheduled run nobody watches.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "packages/*/tests/fuzz*.ts"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run fuzz
        env:
          FUZZ_RUNS: ${{ github.event_name == 'pull_request' && '2000' || '100000' }}
