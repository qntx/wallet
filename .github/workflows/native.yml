name: Native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-host-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install
      - run: bun install
        working-directory: apps/harness
      - run: bunx expo prebuild --platform ios --no-install
        working-directory: apps/harness

      # The host tests link the hermes-engine macOS slice from the harness Pods.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/harness/ios/Pods
          key: native-pods-${{ runner.os }}-${{ hashFiles('apps/harness/bun.lock', 'apps/harness/ios/Podfile.lock') }}
          restore-keys: |
            native-pods-${{ runner.os }}-

      - run: pod install
        working-directory: apps/harness/ios
      # Rebuild and diff the committed artifacts — the rolldown bundle and the
      # manifest reproduce byte-for-byte on any machine. Bytecode is compiled by
      # the consuming app's own hermesc at native-build time and never committed.
      - run: |
          bun run native:kernel
          git diff --exit-code packages/wallet-native/kernel/generated/
          bun run native:host-test
