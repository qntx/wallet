name: Card

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  card-sim:
    # The real qntx card applet (cloned at the vectors/card/SOURCE commit) in its patched
    # jcardsim, driven by the kernel card client through the multi-card stdio bridge.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/qntx-card-sim
          key: card-sim-${{ runner.os }}-${{ hashFiles('vectors/card/SOURCE', 'scripts/card-sim/**') }}
      - run: bun install --frozen-lockfile
      - name: Build the card simulator
        run: |
          launcher="$(bun run card:sim | tail -1)"
          echo "QNTX_CARD_SIM=$launcher" >> "$GITHUB_ENV"
      - run: bunx vp run @qntx/wallet#build
      - name: Card protocol + simulator tests
        run: QNTX_CARD_SIM="$QNTX_CARD_SIM" bun run --cwd packages/wallet-kernel test -- card
