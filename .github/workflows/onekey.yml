name: OneKey emulators

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [classic1s, pro]
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/wallet-kernel/tests/onekey-emulator
          file: packages/wallet-kernel/tests/onekey-emulator/Dockerfile.${{ matrix.model }}
          load: true
          tags: onekey-emu-${{ matrix.model }}
          cache-from: type=gha,scope=onekey-${{ matrix.model }}
          cache-to: type=gha,scope=onekey-${{ matrix.model }},mode=max
      # The emulator speaks UDP 54935 (wire) + 54936 (debug link); the storage file lives in the
      # container's working directory, so each run starts uninitialized.
      - run: >-
          docker run -d --name onekey-emu
          -p 127.0.0.1:54935:54935/udp
          -p 127.0.0.1:54936:54936/udp
          onekey-emu-${{ matrix.model }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # The client and driver resolve @qntx/wallet and @qntx/wallet-chains through their exports → dist.
      - run: bunx vp run @qntx/wallet#build
      - run: bunx vp run @qntx/wallet-chains#build
      # The UDP emulator needs a moment before it answers; give the container time to boot.
      - run: sleep 15
      # Re-record every session against the live emulator, then run the whole suite against the
      # fresh transcript (responses carry live answers); request bytes must equal the committed
      # ones — the check script fails on any drift.
      # The suite reads both models' transcripts: start from the committed ones and overwrite only
      # this model's with the live recording.
      - run: mkdir -p "$RUNNER_TEMP/onekey" && cp vectors/onekey/*.json "$RUNNER_TEMP/onekey/"
      - run: bun scripts/vectors/onekey-emulator.ts --model ${{ matrix.model }} --out "$RUNNER_TEMP/onekey"
      # The driver sessions start from an uninitialized device too: replace the seeded container.
      - run: |
          docker rm -f onekey-emu
          docker run -d --name onekey-emu -p 127.0.0.1:54935:54935/udp -p 127.0.0.1:54936:54936/udp onekey-emu-${{ matrix.model }}
          sleep 15
      - run: >-
          bun scripts/vectors/onekey-emulator.ts --driver
          --model ${{ matrix.model }} --out "$RUNNER_TEMP/onekey"
      - run: ONEKEY_TRANSCRIPTS="$RUNNER_TEMP/onekey" bunx vitest run tests/onekey-*.test.ts
        working-directory: packages/wallet-kernel
      # The engine sessions start from an uninitialized device too: replace the seeded container.
      - run: |
          docker rm -f onekey-emu
          docker run -d --name onekey-emu -p 127.0.0.1:54935:54935/udp -p 127.0.0.1:54936:54936/udp onekey-emu-${{ matrix.model }}
          sleep 15
      # The recorder loads the engine harness + @qntx/wallet(-worker) dist — build them first.
      - run: bunx vp run @qntx/wallet-engine#build
      - run: >-
          bun scripts/vectors/onekey-emulator.ts --engine
          --model ${{ matrix.model }} --out "$RUNNER_TEMP/onekey"
      - run: ONEKEY_TRANSCRIPTS="$RUNNER_TEMP/onekey" bunx vitest run tests/signers-e2e/onekey.test.ts
        working-directory: packages/wallet-engine
      - run: bun scripts/vectors/onekey-check.ts --model ${{ matrix.model }} --fresh "$RUNNER_TEMP/onekey"
